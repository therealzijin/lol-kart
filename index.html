<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LOL 峽谷 GP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{--ink:#1B1A22;--paper:#FFF4DE;--gold:#F2C14E;--blue:#3C8CE7;--red:#E5484D;--panel:rgba(12,18,28,.72);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:#0B1320;color:var(--paper);font-family:-apple-system,"PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%;touch-action:none}
.screen{position:fixed;inset:0;display:none;z-index:20}
.screen.on{display:flex}
/* ---------- 標題 / 選角 ---------- */
#s-title{flex-direction:column;align-items:center;overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 18px max(16px,env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 0%,#1E3A5C 0,#0B1320 70%)}
.t-wrap{width:100%;max-width:860px}
.t-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.t-top h1{flex:1;font-size:26px;font-weight:900;letter-spacing:.02em;background:linear-gradient(90deg,#F2C14E,#FFF4DE);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px}
.seg button.sel{background:var(--paper);color:var(--ink)}
.sub{font-size:13px;opacity:.75;margin-bottom:12px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
.lbl{font-size:12px;font-weight:700;opacity:.7;margin:10px 0 6px}
input.txt{width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--paper);font:inherit;font-size:15px;-webkit-user-select:text;user-select:text}
.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ch{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);aspect-ratio:1;background:#132236}
.ch img{width:100%;height:100%;object-fit:cover;display:block}
.ch span{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:800;padding:14px 4px 4px;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:center}
.ch.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.skins{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.sk{flex:none;width:92px;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:#132236}
.sk img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.sk span{display:block;font-size:10.5px;font-weight:700;padding:4px;line-height:1.2;height:30px;overflow:hidden}
.sk.sel{border-color:var(--gold)}
.kit{margin-top:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.kit b{color:var(--gold)}
.big{display:block;width:100%;padding:14px;border-radius:14px;font-weight:900;font-size:17px;margin-top:12px}
.big.go{background:linear-gradient(180deg,#FFD66B,#F2A93B);color:var(--ink);box-shadow:0 4px 0 #B8741D}
.big.go:active{transform:translateY(2px);box-shadow:0 2px 0 #B8741D}
.big.ghost{border:2px solid var(--line);font-size:14px;padding:11px}
.note{font-size:11px;opacity:.55;line-height:1.5;margin-top:10px}
.err{color:#FF9A8B;font-size:13px;min-height:18px;margin-top:6px}
/* ---------- 讀取 ---------- */
#s-load{align-items:center;justify-content:center;flex-direction:column;background:rgba(11,19,32,.92);gap:12px}
.bar{width:260px;height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F2C14E,#FFE9A8);transition:width .2s}
#load-t{font-size:14px;font-weight:700}
#load-s{font-size:12px;opacity:.6}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#hud.on{display:block}
.pos{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));font-size:44px;font-weight:900;line-height:1;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;color:#fff}
.pos small{font-size:18px;margin-left:2px}
.lap{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));font-size:15px;font-weight:900;background:var(--panel);padding:6px 10px;border-radius:10px}
.lap .tm{display:block;font-size:12px;font-weight:700;opacity:.8;font-variant-numeric:tabular-nums}
#mini{position:absolute;top:max(58px,calc(env(safe-area-inset-top) + 48px));left:max(12px,env(safe-area-inset-left));width:118px;height:118px;border-radius:12px;background:var(--panel)}
.center{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:88px;font-weight:900;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.center.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:26px;font-weight:900;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;white-space:nowrap}
.spd{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;opacity:.75;font-variant-numeric:tabular-nums}
/* ---------- 觸控 ---------- */
#pad{position:fixed;inset:0;z-index:11;display:none}
#pad.on{display:block}
#stick{position:absolute;left:0;top:0;bottom:0;width:48%}
.knob{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);transform:translate(-50%,-50%);display:none;pointer-events:none}
.knob i{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%)}
.btns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end}
.bt{width:64px;height:64px;border-radius:50%;background:var(--panel);border:3px solid rgba(255,255,255,.3);font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bt.drift{width:96px;height:96px;grid-row:1/3;grid-column:2;border-color:var(--gold);color:var(--gold);font-size:15px}
.bt.on{background:rgba(242,193,78,.35)}
.bt .cd{position:absolute;inset:0;background:rgba(0,0,0,.62);transform-origin:top;transform:scaleY(0)}
.bt.icon{background-size:cover;background-position:center;color:transparent;border-color:rgba(255,255,255,.45)}
.bt.ready{border-color:var(--gold);box-shadow:0 0 12px rgba(242,193,78,.7)}
#b-r.ready{animation:rdy 1s ease-in-out infinite}
@keyframes rdy{50%{box-shadow:0 0 22px rgba(242,193,78,1);transform:scale(1.06)}}
#blind{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.35) 0,rgba(12,6,18,.92) 38%,rgba(5,2,8,.98) 70%)}
#h-warn{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:22px;font-weight:900;color:#fff;background:rgba(229,72,77,.9);padding:6px 14px;border-radius:10px;animation:blink .35s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.hint{position:absolute;left:24%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;opacity:.5;font-weight:700}
/* ---------- 結果 ---------- */
#s-result{align-items:center;justify-content:center;background:rgba(8,12,20,.78)}
.res{background:var(--paper);color:var(--ink);border-radius:18px;padding:16px 18px;width:min(92vw,460px);max-height:90vh;overflow:auto;animation:pop2 .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop2{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.res h2{font-size:22px;margin-bottom:8px}
.res table{width:100%;border-collapse:collapse;font-size:14px}
.res td{padding:6px 4px;border-bottom:1px solid #EADCC0}
.res td.n{font-weight:900;width:36px;font-size:18px}
.res td.t{text-align:right;font-variant-numeric:tabular-nums}
.res tr.me{background:#FFE9A8}
.res img{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:6px}
.res .big.ghost{color:var(--ink);border-color:#E5D5B8}
/* ---------- 橫向提示 ---------- */
#rotate{position:fixed;inset:0;z-index:60;background:#0B1320;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:800;text-align:center;padding:20px}
#rotate .ph{width:54px;height:92px;border:4px solid var(--paper);border-radius:12px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
body.racing.portrait #rotate{display:flex}
</style>
</head>
<body>
<div id="game"></div>

<!-- HUD -->
<div id="blind"></div>
<div id="hud">
  <div class="lap"><span id="h-lap"></span><span class="tm" id="h-time">0:00.00</span></div>
  <canvas id="mini" width="236" height="236"></canvas>
  <div class="pos" id="h-pos"></div>
  <div class="center" id="h-center"></div>
  <div class="banner" id="h-banner"></div>
  <div class="spd" id="h-spd"></div>
  <div id="h-warn" style="display:none" data-i="warn"></div>
</div>
<div id="pad">
  <div id="stick"></div>
  <div class="knob" id="knob"><i></i></div>
  <div class="hint" data-i="steerHint"></div>
  <div class="btns">
    <button class="bt" id="b-q">Q<span class="cd"></span></button>
    <button class="bt drift" id="b-drift" data-i="drift"></button>
    <button class="bt" id="b-r">R<span class="cd"></span></button>
  </div>
</div>

<!-- 標題 -->
<section class="screen on" id="s-title">
  <div class="t-wrap">
    <div class="t-top">
      <h1 data-i="title"></h1>
      <div class="seg" id="seg-lang"><button data-v="zh">中文</button><button data-v="ja">日本語</button></div>
    </div>
    <p class="sub" data-i="sub"></p>
    <div class="row">
      <div class="col">
        <div class="lbl" data-i="yourName"></div>
        <input class="txt" id="name" maxlength="8">
        <div class="lbl" data-i="pickChamp"></div>
        <div class="roster" id="roster"></div>
      </div>
      <div class="col">
        <div class="lbl" data-i="pickSkin"></div>
        <div class="skins" id="skins"></div>
        <div class="kit" id="kit"></div>
        <button class="big go" id="b-solo" data-i="solo"></button>
        <button class="big ghost" id="b-online" data-i="online"></button>
        <div class="err" id="t-err"></div>
        <p class="note" data-i="riot"></p>
      </div>
    </div>
  </div>
</section>

<section class="screen" id="s-load"><div id="load-t"></div><div class="bar"><i id="load-bar"></i></div><div id="load-s"></div></section>
<section class="screen" id="s-result"><div class="res" id="res"></div></section>
<div id="rotate"><div class="ph"></div><div data-i="rotate"></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="src/main.js?v=1"></script>
</body>
</html>
